name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  linux-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev-tools \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6kirigami-dev \
            phonon4qt6-dev

      - name: Configure
        run: cmake -S . -B build-ci -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ci

      - name: Lint QML
        run: qmllint src/qml/Main.qml
