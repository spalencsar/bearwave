name: Publish to AUR

# Temporarily disabled (2026-08): AUR community Git/SSH pushes are blocked while
# Arch responds to the AUR supply-chain / malware incident. Web UI may still load,
# but maintainer pushes get "The AUR is down due to maintenance."
# Ref: https://bbs.archlinux.org/viewtopic.php?id=314496
#      https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/
#
# Re-enable push/release triggers below once community AUR write access is restored.
on:
  # push:
  #   branches: [ main ]
  # release:
  #   types: [ published ]
  workflow_dispatch:

jobs:
  aur-publish:
    # Hard-off until AUR accepts community pushes again (avoids failed manual runs).
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish bearwave-git to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret is missing" >&2
            exit 1
          fi

          SSH_DIR="${HOME}/.ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${SSH_DIR}/aur"
          chmod 600 "${SSH_DIR}/aur"

          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> "${SSH_DIR}/known_hosts" 2>/dev/null
          chmod 600 "${SSH_DIR}/known_hosts"

          cat > "${SSH_DIR}/config" <<EOF
          Host aur.archlinux.org
            User aur
            IdentityFile ${SSH_DIR}/aur
            StrictHostKeyChecking yes
          EOF
          # strip leading spaces from heredoc lines for valid ssh config
          sed -i 's/^[[:space:]]*//' "${SSH_DIR}/config"
          chmod 600 "${SSH_DIR}/config"

          git config --global user.name "${AUR_USERNAME:-bearwave-ci}"
          git config --global user.email "moin@nerdbear.de"

          WORKDIR="$(mktemp -d)"
          git clone "ssh://aur@aur.archlinux.org/bearwave-git.git" "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          # Detached HEAD after clone is common with this action; always work on master.
          git fetch origin master
          git checkout -B master "origin/master"

          cp "${GITHUB_WORKSPACE}/PKGBUILD" ./PKGBUILD

          # Generate .SRCINFO via Arch makepkg in Docker (ubuntu runners lack makepkg).
          # - makepkg cannot run as root
          # - write SRCINFO on the host via stdout so ownership stays with the runner user
          docker run --rm \
            -v "${PWD}/PKGBUILD:/PKGBUILD:ro" \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed base-devel >/dev/null
              useradd -m builder
              cp /PKGBUILD /home/builder/PKGBUILD
              chown builder:builder /home/builder/PKGBUILD
              su -s /bin/bash builder -c "cd /home/builder && makepkg --printsrcinfo"
            ' > .SRCINFO

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR package content changes; allowing empty commit"
            git commit --allow-empty -m "Update AUR package via GitHub Actions"
          else
            git commit -m "Update AUR package via GitHub Actions"
          fi

          # Push current commit explicitly to master (avoids detached-HEAD refspec errors).
          git push origin HEAD:master
